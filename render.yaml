# SkillBridge AI — Render Blueprint (Infrastructure-as-Code)
# Allows deploying both backend and frontend on Render using Docker with 1 click.
# Usage: In Render Dashboard, click "New +" -> "Blueprint" and select your repository.

services:
  # ── Django API Backend (Docker) ─────────────────────────────────────────────
  - type: web
    name: skillbridge-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/profiles-list/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # entered in Render dashboard
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your frontend render URL (e.g. https://skillbridge-frontend.onrender.com)
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # set to your frontend render URL (e.g. https://skillbridge-frontend.onrender.com)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ── React/Vite Frontend (Docker + Nginx) ────────────────────────────────────
  - type: web
    name: skillbridge-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: skillbridge-backend
          property: host
