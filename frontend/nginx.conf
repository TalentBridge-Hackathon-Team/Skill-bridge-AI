server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache headers
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all /api/* calls to the Django backend
    # BACKEND_URL defaults to http://backend:8000 for local docker-compose,
    # or can be set to the Render backend URL (e.g. http://${BACKEND_HOST}:8000 or full URL)
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # All other routes → index.html (React SPA client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
