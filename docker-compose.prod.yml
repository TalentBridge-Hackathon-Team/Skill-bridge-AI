# SkillBridge AI — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Before running, set every variable in a .env.prod file (copy .env.example).
# Required overrides vs dev:
#   DEBUG=False
#   ALLOWED_HOSTS=yourdomain.com,www.yourdomain.com
#   CORS_ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
#   VITE_API_BASE_URL=https://api.yourdomain.com/api   (or /api if same host)
#   Remove AWS_ENDPOINT_URL (let SDK hit real AWS)
#   Set real AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   Set OPENROUTER_SITE_URL=https://yourdomain.com

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod          # production secrets file — never commit this
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      # Override LocalStack endpoint — real AWS SDK uses default endpoints when unset
      - AWS_ENDPOINT_URL=
      - AWS_SQS_RESUME_QUEUE_URL=${AWS_SQS_RESUME_QUEUE_URL}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - skillbridge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/profiles-list/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — must be the real public API URL
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.yourdomain.com/api}
    container_name: skillbridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Used by nginx.conf template to proxy /api/* to the backend container
      - BACKEND_HOST=backend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillbridge-net

networks:
  skillbridge-net:
    driver: bridge
